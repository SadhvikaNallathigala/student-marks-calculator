spring.application.name=student-marks-calculator
server.port=8080

# Disable Thymeleaf caching so template edits show up without restart (dev convenience)
spring.thymeleaf.cache=false

# Swagger / OpenAPI
# UI available at:      http://localhost:8080/swagger-ui.html
# Raw JSON spec at:      http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
